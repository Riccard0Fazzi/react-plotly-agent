services:
  ollama:
    image: ollama/ollama:latest
    container_name: react-plotly-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: >
      -c "sleep 10 &&
          OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5-coder:7b"
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

  neo4j:
    image: neo4j:5
    container_name: react-chart-agent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  ollama_models:
  neo4j_data:
